tools:
  approvalMode: write
  approval:
    bash: allow
    browser: allow
    eval: allow
bash:
  patterns:
    - match: sudo
      approval: deny
    - match: sudo *
      approval: deny
    - match: ssh *
      approval: deny
    - match: scp *
      approval: deny
    - match: sftp *
      approval: deny
    - match: rm -rf /
      approval: deny
    - match: rm -rf /*
      approval: deny
    - match: rm -rf ~
      approval: deny
    - match: git push --force*
      approval: deny
    - match: git push -f*
      approval: deny
bashInterceptor:
  enabled: true
lsp:
  diagnosticsOnEdit: true
  requestTimeout: 30
compaction:
  methodOrder:
    - snapcompact
    - handoff
    - shake
    - soft
defaultThinkingLevel: max
providers:
  autoThinkingMaxEffort: max
disabledProviders:
  - amazon-bedrock
  - bedrock-mantle
  - gitlab-duo
  - gitlab-duo-agent
  - lm-studio
  - llama.cpp
enabledModels:
  - ollama/kimi-k3.1-pro:cloud
  - ollama/deepseek-v4.1-flash:1017-cloud
  - ollama/inkling-2-small:cloud
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  noEmbeddings: true
  llmMode: smol
modelRoles:
  default: ollama/deepseek-v4.1-flash:1017-cloud
  slow: ollama/kimi-k3.1-pro:cloud
  plan: ollama/kimi-k3.1-pro:cloud
  review: ollama/kimi-k3.1-pro:cloud
  smol: ollama/deepseek-v4.1-flash:1017-cloud
  commit: ollama/deepseek-v4.1-flash:1017-cloud
  task: ollama/deepseek-v4.1-flash:1017-cloud
  memory: ollama/deepseek-v4.1-flash:1017-cloud
retry:
  fallbackChains:
    ollama/kimi-k3.1-pro:cloud:
      - ollama/deepseek-v4.1-flash:1017-cloud
    ollama/deepseek-v4.1-flash:1017-cloud:
      - ollama/inkling-2-small:cloud
skills:
  enablePiUser: true
  enablePiProject: false
  enableAgentsUser: false
  ignoredSkills:
    - diagnosing-superpowers
    - dispatching-parallel-agents
    - executing-plans
    - finishing-a-development-branch
    - requesting-code-review
    - subagent-driven-development
    - using-git-worktrees
    - using-superpowers
    - writing-plans
  setupVersion: 3
task:
  enableLsp: true
  maxEffort: max
  agentModelOverrides:
    reviewer: "@review:max"
    security-reviewer: "@review:max"
    task: "@task:max"
    sonic: "@smol:max"
    scout: "@smol:max"
cycleOrder:
  - default
  - slow
browser:
  headless: false
  cdpUrl: http://127.0.0.1:9222
security:
  enabled: true
setupVersion: 3